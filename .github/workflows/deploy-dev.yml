name: Deploy dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      ENVIRONMENT: dev
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          npm install --global corepack
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check deployment settings
        run: |
          missing=0
          for name in AWS_ACCOUNT_ID AWS_REGION FRONTEND_DOMAIN_NAME HOSTED_ZONE_ID HOSTED_ZONE_NAME; do
            if [ -z "${!name}" ]; then
              echo "Set the $name repository variable."
              missing=1
            fi
          done
          if [ -z "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "Set the AWS_DEPLOY_ROLE_ARN repository secret to the deploy role ARN."
            missing=1
          fi
          exit "$missing"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy assets
        run: yarn deploy:assets

      - name: Deploy backend
        run: yarn workspace @apocalize/backend deploy -- --outputs-file /tmp/backend-outputs.json

      - name: Read backend outputs
        id: backend
        run: |
          stack=apocalize-dev-backend
          file=/tmp/backend-outputs.json
          api_url="$(jq -er --arg stack "$stack" '.[$stack].ApiUrl' "$file")"
          user_pool_id="$(jq -er --arg stack "$stack" '.[$stack].AuthUserPoolId' "$file")"
          user_pool_client_id="$(jq -er --arg stack "$stack" '.[$stack].AuthUserPoolClientId' "$file")"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$user_pool_id" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$user_pool_client_id" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        env:
          VITE_API_URL: ${{ steps.backend.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.backend.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.backend.outputs.user_pool_client_id }}
        run: yarn deploy:frontend

      - name: Update game data
        run: yarn update:db
