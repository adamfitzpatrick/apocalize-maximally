name: Deploy dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      ENVIRONMENT: dev
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      FRONTEND_DOMAIN_NAME: ${{ vars.FRONTEND_DOMAIN_NAME }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
      CLOUDFRONT_CERTIFICATE_ARN: ${{ vars.CLOUDFRONT_CERTIFICATE_ARN }}
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Branch not allowed::Deployments only run from main (selected ${{ github.ref_name }})."
          exit 1

      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack
        run: |
          npm install --global corepack
          corepack enable
          corepack prepare yarn@4.13.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check deployment settings
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=0
          require() {
            if [ -z "$2" ]; then
              echo "::error title=Missing $1::$3"
              missing=1
            fi
          }
          require AWS_ACCOUNT_ID "$AWS_ACCOUNT_ID" "Add the AWS_ACCOUNT_ID variable to the dev environment."
          require AWS_REGION "$AWS_REGION" "Add the AWS_REGION variable to the dev environment."
          require FRONTEND_DOMAIN_NAME "$FRONTEND_DOMAIN_NAME" "Add the FRONTEND_DOMAIN_NAME variable to the dev environment."
          require HOSTED_ZONE_ID "$HOSTED_ZONE_ID" "Add the HOSTED_ZONE_ID variable to the dev environment."
          require HOSTED_ZONE_NAME "$HOSTED_ZONE_NAME" "Add the HOSTED_ZONE_NAME variable to the dev environment."
          require CLOUDFRONT_CERTIFICATE_ARN "$CLOUDFRONT_CERTIFICATE_ARN" "Add the CLOUDFRONT_CERTIFICATE_ARN variable to the dev environment."
          require AWS_DEPLOY_ROLE_ARN "$AWS_DEPLOY_ROLE_ARN" "Add the AWS_DEPLOY_ROLE_ARN secret to the dev environment."
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy assets
        run: yarn deploy:assets

      - name: Deploy backend
        run: yarn workspace @apocalize/backend deploy --outputs-file "$RUNNER_TEMP/backend-outputs.json"

      - name: Read backend outputs
        id: backend
        run: |
          stack=apocalize-dev-backend
          file="$RUNNER_TEMP/backend-outputs.json"
          api_url="$(jq -er --arg stack "$stack" '.[$stack].ApiUrl' "$file")"
          user_pool_id="$(jq -er --arg stack "$stack" '.[$stack].AuthUserPoolId' "$file")"
          user_pool_client_id="$(jq -er --arg stack "$stack" '.[$stack].AuthUserPoolClientId' "$file")"
          echo "api_url=$api_url" >> "$GITHUB_OUTPUT"
          echo "user_pool_id=$user_pool_id" >> "$GITHUB_OUTPUT"
          echo "user_pool_client_id=$user_pool_client_id" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        env:
          VITE_API_URL: ${{ steps.backend.outputs.api_url }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.backend.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.backend.outputs.user_pool_client_id }}
        run: yarn deploy:frontend

      - name: Update game data
        run: yarn update:db
